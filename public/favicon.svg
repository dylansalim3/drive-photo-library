<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Indigo to Twilight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Top-Left Blade: Cyan to Sky Blue -->
    <linearGradient id="bladeLeft" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Top-Right Blade: Emerald to Mint Teal -->
    <linearGradient id="bladeRight" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bottom Blade: Electric Indigo to Vivid Violet -->
    <linearGradient id="bladeBottom" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Lens Optical Glass Gradient -->
    <radialGradient id="lensGlass" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </radialGradient>

    <!-- Specular Highlight Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Drop Shadow on Blades -->
    <filter id="bladeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#ambientGlow)" />
  
  <!-- Subtle Border Rim -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- Central Camera & Drive Aperture Group -->
  <g transform="translate(0, 4)">
    <!-- 3-Blade Interlocking Drive Triquetra / Aperture -->
    <!-- Blade 1: Top-Left (Sky Cyan) - flowing from bottom-left to top apex -->
    <path d="M 196,104 L 268,64 C 278,58 290,62 296,72 L 324,122 L 232,280 L 152,280 L 108,358 C 100,370 84,374 72,366 C 62,358 58,344 64,332 L 176,138 C 182,126 190,114 196,104 Z"
          fill="url(#bladeLeft)"
          filter="url(#bladeShadow)" />

    <!-- Blade 2: Top-Right (Emerald Mint) - flowing from top apex to bottom-right -->
    <path d="M 324,122 L 396,246 C 404,258 404,272 398,284 L 338,388 C 330,400 316,406 302,402 L 206,402 L 246,332 L 292,254 L 232,150 L 268,64 C 274,74 316,108 324,122 Z"
          fill="url(#bladeRight)"
          filter="url(#bladeShadow)" />

    <!-- Blade 3: Bottom (Electric Indigo) - flowing from bottom-right across to bottom-left -->
    <path d="M 338,388 L 174,388 C 160,388 148,380 142,368 L 108,310 L 200,150 L 254,150 L 208,228 L 248,298 L 368,298 C 382,298 394,308 398,322 C 402,336 394,350 384,360 L 338,388 Z"
          fill="url(#bladeBottom)"
          filter="url(#bladeShadow)" />

    <!-- Overlapping Interlock Accents / Soft Inner Shutter Aperture Curves -->
    <g filter="url(#lensGlow)">
      <!-- Outer Lens Bezel & Camera Barrel Ring -->
      <circle cx="256" cy="262" r="74" fill="#090D16" stroke="#1E293B" stroke-width="4" />
      <circle cx="256" cy="262" r="66" fill="#0F172A" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.4" />

      <!-- Metallic Aperture Stepping Grooves -->
      <circle cx="256" cy="262" r="58" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 4" />

      <!-- Optical Camera Lens Element -->
      <circle cx="256" cy="262" r="48" fill="url(#lensGlass)" />

      <!-- Lens Iris Shutter Blades (3-Blade Internal Aperture Leaves) -->
      <path d="M 256,214 C 272,230 278,252 268,272" stroke="#082F49" stroke-width="2.5" fill="none" stroke-opacity="0.8" />
      <path d="M 298,286 C 280,296 258,292 244,276" stroke="#082F49" stroke-width="2.5" fill="none" stroke-opacity="0.8" />
      <path d="M 214,286 C 218,266 234,250 256,252" stroke="#082F49" stroke-width="2.5" fill="none" stroke-opacity="0.8" />

      <!-- Primary Optical Catchlight / Specular Gloss Arc -->
      <ellipse cx="240" cy="244" rx="22" ry="11" transform="rotate(-38 240 244)" fill="url(#glassReflection)" />

      <!-- Secondary Micro Specular Dot -->
      <circle cx="274" cy="278" r="3.5" fill="#FFFFFF" fill-opacity="0.5" />
    </g>
  </g>
</svg>
