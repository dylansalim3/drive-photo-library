<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Drive Photo Library</title>
    <meta
      name="description"
      content="Stream-only phone viewer for Google Drive photos and videos. Travel uploads are tagged not-sync; bulk download happens from a computer at home, not the phone."
    />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem("dpl_theme");
          var isDark = stored === "dark" || (stored !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
