# drive-photo-library — Cloudflare Pages + Pages Functions + D1, free tier only.
# No paid Cloudflare service is referenced here.
name = "drive-photo-library"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 binding. The database_id below is a PLACEHOLDER on purpose: replace it
# with the real id from `wrangler d1 create drive-photo-library-db` at deploy
# time. Do not invent or commit a real id here.
[[d1_databases]]
binding = "DB"
database_name = "drive-photo-library-db"
database_id = "858d6ccf-a2cd-4b20-afe6-436db5874440"
migrations_dir = "migrations"
